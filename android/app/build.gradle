plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin
    // Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.trackme.app"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.trackme.app"
        // TrackMe's widgets use plain android.widget RemoteViews + AppWidget
        // APIs and org.json (both built into the Android platform), so
        // there's no TrackMe-specific reason to raise minSdk above whatever
        // Flutter's own tooling currently requires.
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for a real release build.
            // Signing with the debug keys so `flutter run --release` works
            // out of the box for local testing.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        doNotStrip "**/*.so"
    }
}

flutter {
    source "../.."
}
