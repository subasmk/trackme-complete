name: trackme
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_slidable: ^3.0.1
  url_launcher: ^6.1.11
  permission_handler: ^10.4.3
  work_manager: ^0.5.2
  http: ^1.1.0
  flutter_local_notifications: ^17.0.0
  flutter_widget_from_html: ^0.14.0
  flutter_html: ^3.0.0
  google_fonts: ^6.1.0
  path_provider: ^2.1.0
  share_plus: ^7.0.0
  intl: ^0.19.0
  fl_chart: ^0.63.0
  flutter_animate: ^4.3.0
  lottie: ^2.0.0
  flutter_lints: ^2.0.0
  flutter_svg: ^2.0.7
  package_info_plus: ^5.0.0
  shimmer: ^2.0.0
  dotted_border: ^3.0.0
  blurhash_flutter: ^0.1.0
  carousel_slider: ^4.2.1
  dots_indicator: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - images/
    - images/avatars/
    - images/badges/
    - images/sloth/

  fonts:
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
        - asset: fonts/RobotoMono-Bold.ttf
        - weight: 700